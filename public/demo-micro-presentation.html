<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NudgeOn 발표용 마이크로스텝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/presentation-demo.css">
</head>
<body>
<div class="demo-shell">
  <div class="demo-head"><div class="brand">nudge.on</div><div class="badge">PRESENTATION DEMO</div></div>
  <div class="hero">
    <aside class="rail"><small>02 · 마이크로스텝</small><h2>지금 가능한 가장 작은 행동부터 시작합니다.</h2><p>발표용 프로필: 제한적 외출 · 외출/대인접촉 부담 · 사회적 연결 희망</p></aside>
    <main class="main">
      <h1>오늘 해볼 수 있는 작은 행동</h1>
      <div class="sub">현재 상태와 목표를 바탕으로 실행 가능한 행동 3개를 제안했습니다.</div>
      <section class="cards" id="demoCards"></section>
      <div class="toolbar"><span class="note">원하는 행동이 아니면 같은 난이도대의 다른 행동으로 다시 추천할 수 있어요.</span><button class="swap" id="swapSteps">다른 걸로 바꿔주세요</button></div>
      <div class="toast" id="demoToast" aria-live="polite"></div>
    </main>
  </div>
</div>
<script src="/assets/presentation-demo-page.js"></script>
</body>
</html>
