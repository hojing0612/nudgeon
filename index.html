<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nudge on — 다시, 세상과 연결되는 작은 신호</title>

<!-- ── 폰트 ─────────────────────────────────────────────
     Gowun Batang : 제목용 명조. 부드럽고 사람 목소리 같은 느낌.
     Pretendard   : 본문용 고딕. 한국어 UI 표준.
     IBM Plex Mono: 단계 번호·라벨 같은 아주 작은 글자.
──────────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ═══════════════════════════════════════════════════════════
   1. 디자인 토큰 — 색·간격을 여기 한 곳에서만 정의한다.
      이렇게 해두면 나중에 색 하나 바꿀 때 한 줄만 고치면 된다.
   ═══════════════════════════════════════════════════════════ */
:root{
  --paper:#F1F3F0;      /* 배경: 차갑고 옅은 회녹색 */
  --surface:#FBFCFA;    /* 카드 */
  --mist:#E3E8E4;       /* 옅은 면 */
  --line:#CBD3CD;       /* 선 */
  --ink:#242A28;        /* 본문 글자 */
  --ink-soft:#5D6864;   /* 보조 글자 */
  --sage:#6F8F80;       /* 주 색: 조용한 세이지 */
  --sage-deep:#41594E;
  --amber:#C9922F;      /* 유일한 강조색 = '빛'. 오늘 할 일 하나에만 쓴다 */
  --amber-soft:#F4E7CA;

  --open:0;             /* 0→1. 진행도. 창문 커튼이 이만큼 열린다 */

  --r:14px;
  --shadow:0 1px 2px rgba(36,42,40,.05), 0 12px 32px -18px rgba(36,42,40,.28);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--sage-deep); outline-offset:3px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══════════════════════════════════════════════════════════
   2. 레이아웃 — 왼쪽 여정 레일 + 오른쪽 작업 화면
   ═══════════════════════════════════════════════════════════ */
.app{display:grid; grid-template-columns:296px 1fr; min-height:100vh}

.rail{
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:30px 26px; display:flex; flex-direction:column; gap:26px;
  position:sticky; top:0; height:100vh;
}
.brand{font-family:'Gowun Batang',serif; font-size:25px; letter-spacing:-.01em}
.brand .dot{color:var(--amber)}
.brand-sub{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft); margin-top:2px;
}

/* ── 시그니처 요소: 창문. 진행할수록 커튼이 열리고 빛이 든다 ── */
.window{width:100%; aspect-ratio:1/.86; border-radius:10px; overflow:hidden}
.curtain{transition:transform 1.1s cubic-bezier(.22,.9,.3,1)}
.curtain.l{transform:translateX(calc(var(--open) * -46px))}
.curtain.r{transform:translateX(calc(var(--open) * 46px))}
.daylight{opacity:calc(.1 + var(--open) * .9); transition:opacity 1.1s ease}
.window-note{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em;
  color:var(--ink-soft); text-align:center; margin-top:9px;
}

.journey{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px}
.jstep{
  display:grid; grid-template-columns:26px 1fr; gap:11px; align-items:baseline;
  padding:9px 10px; border-radius:9px; color:var(--ink-soft);
  font-size:14px; transition:background .2s,color .2s;
}
.jstep .num{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em}
.jstep[data-state="done"]{color:var(--sage-deep)}
.jstep[data-state="done"] .num::after{content:" ✓"}
.jstep[data-state="now"]{background:var(--amber-soft); color:var(--ink); font-weight:600}
.rail-foot{margin-top:auto; font-size:12px; color:var(--ink-soft); line-height:1.6}

.stage{padding:64px 56px 96px; display:flex; justify-content:center}
.col{width:100%; max-width:660px}

/* ═══════════════════════════════════════════════════════════
   3. 공통 부품
   ═══════════════════════════════════════════════════════════ */
.eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--sage); margin-bottom:14px;
}
h1.big{
  font-family:'Gowun Batang',serif; font-weight:400;
  font-size:38px; line-height:1.42; letter-spacing:-.015em; margin:0 0 18px;
}
h2.mid{
  font-family:'Gowun Batang',serif; font-weight:400;
  font-size:27px; line-height:1.5; margin:0 0 12px;
}
p.lede{font-size:16px; color:var(--ink-soft); margin:0 0 30px; max-width:56ch}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px}
.card + .card{margin-top:12px}

.btn{
  font-family:inherit; font-size:14.5px; font-weight:600;
  padding:12px 22px; border-radius:10px; border:1px solid var(--sage-deep);
  background:var(--sage-deep); color:#fff; cursor:pointer; transition:.16s;
}
.btn:hover{background:#37493F}
.btn.ghost{background:transparent; color:var(--sage-deep)}
.btn.ghost:hover{background:var(--mist)}
.btn.quiet{background:transparent; border-color:var(--line); color:var(--ink-soft); font-weight:500}
.btn.quiet:hover{background:var(--mist); color:var(--ink)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:26px}

/* 선택지 */
.opts{display:flex; flex-direction:column; gap:8px; margin-top:18px}
.opt{
  text-align:left; font-family:inherit; font-size:15px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:14px 17px; cursor:pointer; transition:.16s;
}
.opt:hover{border-color:var(--sage); background:#fff}
.opt[aria-pressed="true"]{border-color:var(--sage-deep); background:var(--mist); font-weight:600}

.qcount{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); letter-spacing:.08em}
.bar{height:3px; background:var(--mist); border-radius:2px; margin:12px 0 34px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--sage); transition:width .45s ease}

/* 마이크로스텝 */
.step-item{
  display:grid; grid-template-columns:24px 1fr auto; gap:14px; align-items:start;
  padding:16px 18px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); margin-bottom:9px;
}
.step-item.today{border-color:var(--amber); background:linear-gradient(0deg,var(--amber-soft),var(--surface) 70%)}
.step-item.done{opacity:.5}
.step-item.done .step-text{text-decoration:line-through}
.tick{
  width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line);
  background:#fff; cursor:pointer; padding:0; font-size:13px; color:var(--sage-deep);
}
.tick[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:#fff}
.step-text{font-size:15px; line-height:1.6}
.step-why{font-size:12.5px; color:var(--ink-soft); margin-top:3px}
.tiny{
  font-family:inherit; font-size:12px; color:var(--ink-soft); background:transparent;
  border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; white-space:nowrap;
}
.tiny:hover{background:var(--mist); color:var(--ink)}

/* 리허설 */
.chat{
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  padding:20px; height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:13px;
}
.msg{max-width:80%; padding:11px 15px; border-radius:14px; font-size:14.5px; line-height:1.65}
.msg.them{background:var(--mist); border-bottom-left-radius:4px; align-self:flex-start}
.msg.me{background:var(--sage-deep); color:#fff; border-bottom-right-radius:4px; align-self:flex-end}
.msg.coach{
  align-self:stretch; max-width:100%; background:transparent;
  border-left:2px solid var(--amber); border-radius:0; padding:2px 0 2px 13px;
  font-size:13px; color:var(--ink-soft);
}
.composer{display:flex; gap:9px; margin-top:12px}
.composer textarea{
  flex:1; font-family:inherit; font-size:14.5px; line-height:1.6; resize:none;
  padding:12px 14px; border:1px solid var(--line); border-radius:11px;
  background:var(--surface); color:var(--ink); min-height:52px;
}

/* 연결 */
.res{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:18px 20px; margin-bottom:10px}
.tag{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--sage-deep);
  background:var(--mist); padding:3px 8px; border-radius:5px; margin-bottom:9px;
}
.res h3{font-size:16.5px; margin:0 0 6px; font-weight:600}
.res p{margin:0; font-size:13.5px; color:var(--ink-soft)}
.draft{
  background:var(--mist); border-radius:11px; padding:16px 18px; margin-top:12px;
  font-size:14.5px; line-height:1.75; white-space:pre-wrap;
}

.note{
  font-size:12.5px; color:var(--ink-soft); border-left:2px solid var(--line);
  padding-left:13px; margin-top:26px; line-height:1.65;
}
.spin{display:inline-block; color:var(--ink-soft); font-size:13.5px}
.hide{display:none!important}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; gap:18px}
  .window{width:74px}
  .journey{flex-direction:row; flex-wrap:wrap}
  .window-note,.rail-foot{display:none}
  .stage{padding:36px 22px 72px}
}
</style>
</head>
<body>

<div class="app">
  <!-- ───────── 왼쪽: 여정 레일 ───────── -->
  <aside class="rail">

      <div class="brand">nudge<span class="dot"> on</span></div>

<script>
/* ═══════════════════════════════════════════════════════════

  { n:5, name:'사회적 연결 준비', line:'연결을 시작할 준비가 꽤 되어 있어요.' }

/* ═══════════════════════════════════════════════════════════
   5. 상태 — 앱이 기억하는 모든 것. 여기만 바꾸고 다시 그린다.
   ═══════════════════════════════════════════════════════════ */
const state = {
  screen:'intro',
  qi:0, answers:{},
  profile:null, report:null,
  micro:[], scenario:null, messages:[], busy:false,
  draft:null, visited:new Set()
};

const stage = document.getElementById('stage');
const SCREENS = ['check','micro','rehearsal','connect','record'];
const SCREEN_NAMES = ['자가진단','마이크로스텝','사회적 리허설','AI 연결','기록·성장'];

/* ═══════════════════════════════════════════════════════════
   6. AI 호출 — 실패해도 앱이 멈추지 않게 항상 대비책을 둔다
   ═══════════════════════════════════════════════════════════ */
async function ask(messages, system){
  /* Anthropic이 아니라 '우리 백엔드'(api/chat.js)를 부른다.
     API 키는 저쪽에서 붙는다. 이 파일에는 키가 한 글자도 없다.
     주의: 파일을 그냥 더블클릭해서 열면 /api/chat 이 없어서 실패한다.
           그래도 앱은 아래 fallback으로 계속 동작한다. 정상이다. */
  const res = await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ messages, system })
  });
  if(!res.ok) throw new Error('API ' + res.status);
  const data = await res.json();
  return (data.text || '').trim();
}

/* JSON을 요구했을 때 앞뒤 군더더기를 걷어내고 파싱 */
function parseJSON(text){
  const clean = text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1));
}

/* ═══════════════════════════════════════════════════════════
   7. 프로파일링 — 규칙 기반. AI 없이도 항상 동작한다.
   ═══════════════════════════════════════════════════════════ */
function buildProfile(a){
  let s = 0;
  s += {a:0,b:1,c:2,d:3}[a.out];
  s += {a:0,b:1,c:2,d:3}[a.talk];
  s += {a:0,b:1,c:1}[a.rhythm];
  const n = Math.min(5, Math.max(1, Math.ceil((s+1)/1.5)));
  const lv = LEVELS[n-1];
  return { level:n, levelName:lv.name, levelLine:lv.line,
           barrier:a.barrier, barrierLabel:BARRIERS[a.barrier].label,
           path:BARRIERS[a.barrier].path, vision:a.vision };
}

/* ═══════════════════════════════════════════════════════════
   8. 화면 그리기
   ═══════════════════════════════════════════════════════════ */
function render(){
  renderRail();
  const fn = {intro:vIntro, check:vCheck, report:vReport, micro:vMicro,
              rehearsal:vRehearsal, connect:vConnect, record:vRecord}[state.screen];
  stage.innerHTML = fn();
  bind();
  stage.querySelector('h1,h2')?.focus?.();
}

function renderRail(){
  const cur = state.screen==='report' ? 'check' : state.screen;
  const ci = SCREENS.indexOf(cur);
  document.getElementById('journey').innerHTML = SCREENS.map((s,i)=>{
    const done = state.visited.has(s) && i !== ci;
    const st = i===ci ? 'now' : (done ? 'done' : 'todo');
    return `<li class="jstep" data-state="${st}">
      <span class="num">0${i+1}</span><span>${SCREEN_NAMES[i]}</span></li>`;
  }).join('');

  const p = state.visited.size / 5;
  document.documentElement.style.setProperty('--open', p.toFixed(2));
  const notes = ['커튼은 아직 닫혀 있어요','조금 열렸어요','빛이 들어오고 있어요',
                 '창밖이 보여요','거의 다 열렸어요','창문이 열렸어요'];
  document.getElementById('windowNote').textContent = notes[Math.round(p*5)];
}

/* ═══════════════════════════════════════════════════════════
   9. 이벤트 연결
   ═══════════════════════════════════════════════════════════ */
function bind(){
  stage.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  stage.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{
    Object.assign(state,{screen:'check',qi:0,answers:{},profile:null,report:null,
      micro:[],scenario:null,messages:[],draft:null,visited:new Set()});
    render();
  });
  stage.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>answer(b.dataset.ans));
  stage.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{state.qi--; render()});
  stage.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.tick; state.micro[i].done=!state.micro[i].done; render();
  });
  stage.querySelectorAll('[data-smaller]').forEach(b=>b.onclick=()=>makeSmaller(+b.dataset.smaller));
  stage.querySelectorAll('[data-regen]').forEach(b=>b.onclick=()=>loadSteps(true));
  stage.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>startScenario(b.dataset.scenario));
  stage.querySelectorAll('[data-exitsc]').forEach(b=>b.onclick=()=>{state.scenario=null; state.messages=[]; render()});
  stage.querySelectorAll('[data-send]').forEach(b=>b.onclick=send);
  stage.querySelectorAll('[data-draft]').forEach(b=>b.onclick=makeDraft);
  stage.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
    navigator.clipboard?.writeText(state.draft); b.textContent='복사했어요';
  });
  const say = document.getElementById('say');
  if(say){ say.focus(); say.onkeydown = e => {
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } }; }
  const chat = document.getElementById('chat');
  if(chat) chat.scrollTop = chat.scrollHeight;
}

function go(s){
  state.visited.add(s==='report'?'check':s);
  state.screen = s;
  render();
  if(s==='micro' && !state.micro.length) loadSteps();
}

function answer(val){
  const Q = QUESTIONS[state.qi];
  state.answers[Q.key] = val;
  if(state.qi < QUESTIONS.length-1){ state.qi++; render(); }
  else finishCheck();
}

async function finishCheck(){
  state.profile = buildProfile(state.answers);
  state.visited.add('check');
  state.screen = 'report';
  render();
  try{
    state.report = await ask(
      [{role:'user',content:
        `현재 연결 단계: Lv.${state.profile.level} ${state.profile.levelName}\n`+
        `주요 장벽: ${state.profile.barrierLabel}\n`+
        `1년 뒤 바람: ${state.answers.vision}\n`+
        `이 사람에게 2~3문장으로 리포트를 써줘.`}],
      `너는 고립·은둔 청년을 돕는 서비스의 진단 리포트 작성자다.
규칙: 진단명·병명을 쓰지 않는다. 격려나 응원 문구를 쓰지 않는다.
"괜찮아요","할 수 있어요" 같은 말은 금지. 지금 상태를 담담하게 서술하고,
왜 이 장벽 때문에 멈추는지를 설명하고, 그래서 어떤 크기의 행동부터 시작할지를 말한다.
반말 금지, 존댓말. 2~3문장. 다른 말 없이 리포트만 출력.`);
    if(state.screen==='report') render();
  }catch(e){ console.warn('리포트 생성 실패, 기본 문구 사용:', e); }
}

async function loadSteps(regen=false){
  const p = state.profile;
  state.micro = FALLBACK_STEPS[p.barrier].map(t=>({text:t,why:'',done:false}));
  render();
  try{
    const txt = await ask(
      [{role:'user',content:
        `단계 Lv.${p.level}(${p.levelName}), 장벽: ${p.barrierLabel}, 바람: ${p.vision}.
${regen?'이전과 다른 새로운 것으로 ':''}오늘 할 수 있는 행동 3개를 만들어줘.`}],
      `너는 고립 청년에게 오늘 할 수 있는 아주 작은 행동을 설계한다.
규칙: 실패할 수 없을 만큼 작게. 첫 번째가 가장 쉽고, 3번이 조금 더 크다.
Lv.1~2면 집 밖으로 나가라고 하지 않는다. 각 행동은 15자 이내.
why는 왜 이게 지금 맞는지 25자 이내 한 문장.
JSON만 출력: {"steps":[{"text":"...","why":"..."}]}`);
    const j = parseJSON(txt);
    state.micro = j.steps.slice(0,3).map(s=>({text:s.text, why:s.why||'', done:false}));
  }catch(e){ console.warn('스텝 생성 실패, 기본 목록 사용:', e); }
  if(state.screen==='micro') render();
}

async function makeSmaller(i){
  const cur = state.micro[i];
  const original = cur.text;
  cur.text = '더 작게 만드는 중…'; render();
  try{
    const txt = await ask(
      [{role:'user',content:`"${original}" — 이걸 절반 크기의 행동으로 바꿔줘.`}],
      `고립 청년이 부담을 느낀 행동을 더 작게 쪼갠다.
"나가기"→"신발 신어보기"처럼 실패할 수 없는 크기로. 15자 이내. 행동 문장만 출력.`);
    cur.text = txt.replace(/^["']|["']$/g,'');
  }catch(e){ cur.text = original + ' — 딱 1분만'; }
  cur.why = '부담돼서 더 작게 바꿨어요';
  render();
}

function startScenario(id){
  const sc = SCENARIOS.find(s=>s.id===id);
  state.scenario = id;
  state.messages = [{role:'them', text:sc.open}];
  render();
}

async function send(){
  const el = document.getElementById('say');
  const text = el.value.trim();
  if(!text || state.busy) return;
  state.messages.push({role:'me', text});
  state.busy = true; render();

  const sc = SCENARIOS.find(s=>s.id===state.scenario);
  try{
    const history = state.messages.filter(m=>m.role!=='coach').map(m=>({
      role: m.role==='me' ? 'user' : 'assistant', content:m.text }));
    const txt = await ask(history,
      `너는 사회적 리허설 상대다. 역할: ${sc.who}. 상황: ${sc.title}.
상대는 오래 사람을 만나지 않은 청년이다. 절대 냉담하거나 무례하지 않다.
말투는 현실적이되 따뜻하고, 2~3문장으로 짧게. 실제로 그 사람이 할 법한 대화만 한다.
그리고 마지막에 한 줄, 사용자에게 주는 짧은 코칭을 붙인다.
형식: 대화 내용 → 줄바꿈 → "COACH: 코칭 한 문장"`);
    const [reply, coach] = txt.split(/COACH\s*:/);
    state.messages.push({role:'them', text:reply.trim()});
    if(coach) state.messages.push({role:'coach', text:'코칭 · ' + coach.trim()});
  }catch(e){
    state.messages.push({role:'them', text:'네, 편하게 말씀해 주세요. 천천히 하셔도 괜찮습니다.'});
    state.messages.push({role:'coach', text:'코칭 · 지금처럼 한 문장만 써도 충분히 전달돼요.'});
  }
  state.busy = false; render();
}

async function makeDraft(){
  const p = state.profile;
  state.draft = '문장을 만드는 중…'; render();
  try{
    state.draft = await ask(
      [{role:'user',content:
        `Lv.${p.level} ${p.levelName}, 장벽 ${p.barrierLabel}, 바람 ${p.vision}인 청년이
상담센터에 처음 보낼 문의 메시지를 써줘.`}],
      `한국 대학·청년기관에 처음 문의하는 메시지를 대신 쓴다.
규칙: 3~4문장. 과하게 사정을 설명하지 않는다. 사과로 시작하지 않는다.
"늦어서 죄송하지만" 같은 표현 금지. 담담하고 짧게. 메시지 본문만 출력.`);
  }catch(e){
    state.draft = '안녕하세요. 상담을 신청하고 싶어 연락드립니다.\n요즘 밖에 나가거나 사람을 만나는 게 어려워서, 어디서부터 도움을 받으면 좋을지 알고 싶습니다.\n첫 상담은 어떻게 진행되는지 알려주실 수 있을까요?';
  }
  render();
}

render();
</script>
